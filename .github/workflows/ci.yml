name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  user-service-tests:
    name: User service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/user-service/requirements.txt
      - run: python -m pip install -r requirements.txt flake8
      - run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-test-secret
          DEBUG: 'True'

  book-service-tests:
    name: Book service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/book-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/book-service/requirements.txt
      - run: python -m pip install -r requirements.txt flake8
      - run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Debug Python import path
        run: |
          pwd
          python -c "import os, sys; print('CWD:', os.getcwd()); print('sys.path:', sys.path)"
          python -c "import app; print('app:', app.__file__)"
          ls -la
          ls -la app

      - run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-test-secret
          DEBUG: 'True'
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token

  loan-service-tests:
    name: Loan service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/loan-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/loan-service/requirements.txt
      - run: python -m pip install -r requirements.txt flake8
      - run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Debug Python import path
        run: |
          pwd
          python -c "import os, sys; print('CWD:', os.getcwd()); print('sys.path:', sys.path)"
          python -c "import app; print('app:', app.__file__)"
          ls -la
          ls -la app
      - run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-test-secret
          DEBUG: 'True'
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token
          USER_SERVICE_URL: http://user-service:8000
          BOOK_SERVICE_URL: http://book-service:8001

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
